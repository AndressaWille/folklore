[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "folklore-clumps"
dynamic = ["version"]
description = "Detection, cross-filter matching and photometry of star-forming clumps in multi-filter photometric data cubes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Andressa Wille"}]
requires-python = ">=3.9"
keywords = ["astronomy", "galaxies", "clumps", "jellyfish galaxies", "JWST", "HST", "photometry"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
]
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib>=3.5",
    "astropy>=5.0",
    "scikit-image",
    "networkx",
    "shapely>=2.0",
    "geopandas",
]

[project.optional-dependencies]
test = ["pytest"]
docs = [
    "sphinx",
    "sphinx-rtd-theme",
    "myst-nb",
]

[project.urls]
Homepage = "https://github.com/AndressaWille/folklore"
Documentation = "https://folklore.readthedocs.io"
Issues = "https://github.com/AndressaWille/folklore/issues"

[tool.setuptools.dynamic]
version = {attr = "folklore.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
